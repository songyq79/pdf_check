worker_processes auto;           # 自动匹配 CPU 核心数（32核=32进程）
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;     # 每个 nginx 进程最大连接数
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 日志格式（含响应时间，便于排查慢请求）
    log_format main '$remote_addr - $request_time s "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # 上传文件最大 50MB（论文 docx）
    client_max_body_size 50m;
    client_body_timeout 60s;

    # gzip 压缩 API 响应
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;

    # FastAPI 后端（gunicorn 16进程）
    upstream api_backend {
        server api:8000;
        keepalive 64;            # 保持长连接复用，减少握手开销
    }

    server {
        listen 80;
        server_name _;

        # 前端静态文件
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;  # Vue Router history 模式
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }

        # API 反向代理
        location /api/ {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";         # 启用 HTTP 长连接
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

            # AI 任务耗时长，超时要放宽
            proxy_read_timeout    300s;
            proxy_connect_timeout  10s;
            proxy_send_timeout     60s;
        }

        # 文件下载（docx 结果文件）不走 gzip
        location /api/v1/proofread/download/ {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_buffering    off;                  # 大文件直接流式转发
            proxy_read_timeout 120s;
        }
    }
}
