# 绑定所有接口（Docker 内部访问）
bind 0.0.0.0
port 6379
protected-mode no

# 最大内存 8GB（128GB服务器，给Redis分8GB够用）
maxmemory 8gb
# 内存满时：只淘汰设了过期时间的 key
maxmemory-policy allkeys-lru

# ── 持久化（解决 Redis 重启数据丢失）─────────────────────────
# RDB 快照：60秒内有1000次写则触发保存
save 60 1000
# AOF 追加日志：每秒刷盘，崩溃最多丢1秒数据
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite yes

# 日志
loglevel notice
logfile ""

# 最大连接数
maxclients 10000

# 慢查询记录（>10ms）
slowlog-log-slower-than 10000
slowlog-max-len 128
